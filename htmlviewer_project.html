<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><style>/* Your CSS styles here */
button:hover { transform: scale(1.05); transition: 0.2s; }</style></head><body><!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TravelConnect — Connect with trusted travelers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2A4A;
    --ink-70: rgba(27,42,74,.7);
    --ink-45: rgba(27,42,74,.45);
    --paper:#F6F3ED;
    --paper-2:#EFEAE0;
    --white:#FFFFFF;
    --amber:#E2A33D;
    --amber-dark:#B67B1E;
    --teal:#2F6F63;
    --teal-dark:#204D44;
    --rust:#B3432B;
    --line: rgba(27,42,74,.14);
    --line-strong: rgba(27,42,74,.22);
    --shadow: 0 1px 2px rgba(27,42,74,.06), 0 8px 24px -12px rgba(27,42,74,.18);
    --radius: 14px;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#F3EFE6; --ink-70: rgba(243,239,230,.72); --ink-45: rgba(243,239,230,.48);
      --paper:#12182A; --paper-2:#182038; --white:#1A2138;
      --line: rgba(243,239,230,.14); --line-strong: rgba(243,239,230,.24);
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --ink:#F3EFE6; --ink-70: rgba(243,239,230,.72); --ink-45: rgba(243,239,230,.48);
    --paper:#12182A; --paper-2:#182038; --white:#1A2138;
    --line: rgba(243,239,230,.14); --line-strong: rgba(243,239,230,.24);
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  html{scroll-padding-top: env(safe-area-inset-top, 0px);}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    line-height:1.5;
  }
  h1,h2,h3,.serif{ font-family:'Fraunces', Georgia, serif; letter-spacing:-0.01em; }
  a{color:inherit;}
  img{max-width:100%; display:block;}
  button{font-family:inherit;}
  ::selection{ background: var(--amber); color:var(--ink); }
  .wrap{ max-width:1120px; margin:0 auto; padding:0 24px; }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    padding:13px 22px; border-radius:999px; border:1px solid transparent;
    font-weight:600; font-size:15px; cursor:pointer; transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
    white-space:nowrap;
  }
  .btn:active{ transform: scale(.97); }
  .btn-primary{ background:var(--ink); color:var(--paper); }
  .btn-primary:hover{ box-shadow:var(--shadow); }
  .btn-amber{ background:var(--amber); color:var(--ink); }
  .btn-amber:hover{ background:var(--amber-dark); }
  .btn-outline{ background:transparent; border-color:var(--line-strong); color:var(--ink); }
  .btn-outline:hover{ border-color:var(--ink); }
  .btn-ghost{ background:transparent; color:var(--ink-70); padding:10px 14px; }
  .btn-danger{ background: var(--rust); color:#fff; }
  .btn-sm{ padding:9px 16px; font-size:13.5px; }
  .btn-block{ width:100%; }
  .btn:disabled{ opacity:.5; cursor:not-allowed; }

  .card{ background:var(--white); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); }
  .pill{ display:inline-flex; align-items:center; gap:6px; padding:5px 12px; border-radius:999px; font-size:12.5px; font-weight:600; }
  .pill-teal{ background: rgba(47,111,99,.12); color:var(--teal); }
  .pill-amber{ background: rgba(226,163,61,.16); color:var(--amber-dark); }
  .pill-rust{ background: rgba(179,67,43,.12); color:var(--rust); }
  .pill-line{ background: var(--paper-2); color: var(--ink-70); }

  input,select,textarea{
    width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--line-strong);
    background:var(--white); color:var(--ink); font-size:15px; font-family:inherit;
  }
  input:focus,select:focus,textarea:focus{ outline:2px solid var(--teal); outline-offset:1px; }
  label{ font-size:13px; font-weight:600; color:var(--ink-70); display:block; margin-bottom:6px; }
  .field{ margin-bottom:16px; }
  .hint{ font-size:12.5px; color:var(--ink-45); margin-top:5px; }

  /* Route-line motif */
  .route-line{ position:relative; padding-left:34px; }
  .route-line::before{
    content:""; position:absolute; left:9px; top:6px; bottom:6px; width:2px;
    background: repeating-linear-gradient(180deg, var(--line-strong) 0 6px, transparent 6px 12px);
  }
  .route-dot{ position:absolute; left:2px; width:16px; height:16px; border-radius:50%; background:var(--white); border:2px solid var(--teal); }
  .route-dot.filled{ background:var(--teal); }

  /* ===== App chrome ===== */
  #topbar{
    position:sticky; top:0; z-index:40; background: rgba(246,243,237,.86); backdrop-filter: blur(10px);
    border-bottom:1px solid var(--line);
    padding-top: env(safe-area-inset-top, 0px);
  }
  :root[data-theme="dark"] #topbar, @media (prefers-color-scheme:dark){ #topbar{ background: rgba(18,24,42,.86);} }
  .topbar-inner{ display:flex; align-items:center; justify-content:space-between; padding:14px 24px; max-width:1120px; margin:0 auto; }
  .brand{ display:flex; align-items:center; gap:9px; font-family:'Fraunces',serif; font-weight:600; font-size:19px; }
  .brand-mark{ width:28px; height:28px; border-radius:8px; background:var(--ink); display:flex; align-items:center; justify-content:center; }
  .brand-mark svg{ width:16px; height:16px; }
  .nav-links{ display:flex; gap:6px; align-items:center; }
  .nav-links a.navlink{ padding:9px 14px; border-radius:999px; font-size:14px; font-weight:600; color:var(--ink-70); }
  .nav-links a.navlink.active{ background:var(--ink); color:var(--paper); }

  main{ min-height: calc(100vh - 64px); padding-bottom: 96px; }
  .app-shell main{ padding-bottom: 100px; }

  /* Sidebar (desktop) */
  #sidebar{ display:none; }
  @media (min-width: 900px){
    .app-shell{ display:grid; grid-template-columns: 240px 1fr; }
    #sidebar{
      display:flex; flex-direction:column; gap:2px; padding:20px 14px; border-right:1px solid var(--line);
      position:sticky; top:64px; height:calc(100vh - 64px);
    }
    #bottomnav{ display:none !important; }
    .app-shell main{ padding-bottom:40px; }
  }
  .sidelink{ display:flex; align-items:center; gap:12px; padding:11px 14px; border-radius:10px; font-weight:600; color:var(--ink-70); font-size:14.5px; }
  .sidelink svg{ width:19px; height:19px; flex:none; }
  .sidelink.active{ background:var(--paper-2); color:var(--ink); }

  /* Bottom nav (mobile) */
  #bottomnav{
    position:fixed; left:0; right:0; bottom:0; z-index:50;
    background:var(--white); border-top:1px solid var(--line);
    display:flex; justify-content:space-around; padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));
  }
  .navbtn{ display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--ink-45); font-size:10.5px; font-weight:600; padding:4px 8px; border-radius:10px; background:none; border:none; }
  .navbtn svg{ width:21px; height:21px; }
  .navbtn.active{ color:var(--teal); }

  /* ===== Landing ===== */
  .hero{ padding:64px 0 56px; position:relative; overflow:hidden; }
  .hero-grid{ display:grid; grid-template-columns:1fr; gap:40px; align-items:center; }
  @media(min-width:860px){ .hero-grid{ grid-template-columns:1.05fr .95fr; gap:56px; } }
  .eyebrow-route{ display:flex; align-items:center; gap:10px; font-size:13px; font-weight:600; color:var(--teal); margin-bottom:18px; }
  .eyebrow-route .dash{ width:34px; height:2px; background: repeating-linear-gradient(90deg, var(--teal) 0 6px, transparent 6px 11px); }
  .hero h1{ font-size: clamp(34px, 5.4vw, 58px); line-height:1.04; font-weight:600; margin:0 0 20px; max-width:14ch; }
  .hero p.sub{ font-size:18px; color:var(--ink-70); max-width:46ch; margin:0 0 30px; }
  .hero-ctas{ display:flex; gap:12px; flex-wrap:wrap; }
  .hero-visual{ position:relative; }
  .journey-mock{ background:var(--white); border:1px solid var(--line); border-radius:20px; box-shadow:var(--shadow); padding:22px; position:relative; }
  .journey-mock .route-row{ display:flex; align-items:center; gap:10px; font-family:'Fraunces',serif; font-size:20px; font-weight:600; margin-bottom:4px; }
  .journey-mock .route-row .arrow{ color:var(--amber-dark); font-size:16px; }
  .traveler-chip{ display:flex; align-items:center; gap:10px; padding:10px; border-radius:12px; background:var(--paper); margin-top:10px; }
  .avatar{ width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; color:#fff; flex:none; }
  .traveler-chip .meta{ font-size:12.5px; color:var(--ink-45); }
  .traveler-chip .name{ font-size:14px; font-weight:600; }

  section.split{ padding:56px 0; border-top:1px solid var(--line); }
  .section-head{ max-width:560px; margin-bottom:36px; }
  .section-head h2{ font-size: clamp(26px,3.4vw,36px); font-weight:600; margin:0 0 10px; }
  .section-head p{ color:var(--ink-70); margin:0; font-size:16px; }

  .trust-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:14px; }
  .trust-card{ padding:20px; }
  .trust-card svg{ width:22px; height:22px; color:var(--teal); margin-bottom:14px; }
  .trust-card h3{ font-size:16px; font-weight:600; margin:0 0 6px; font-family:'Inter'; }
  .trust-card p{ font-size:13.5px; color:var(--ink-70); margin:0; }

  .steps{ max-width:640px; }
  .step-item{ position:relative; padding:0 0 30px 34px; }
  .step-item:last-child{ padding-bottom:0; }
  .step-item h3{ font-family:'Inter'; font-size:16px; font-weight:700; margin:0 0 4px; }
  .step-item p{ margin:0; color:var(--ink-70); font-size:14.5px; }

  footer{ border-top:1px solid var(--line); padding:36px 0; margin-top:20px; }
  .footer-row{ display:flex; flex-wrap:wrap; gap:18px; justify-content:space-between; align-items:center; }
  .footer-links{ display:flex; gap:18px; flex-wrap:wrap; font-size:13.5px; color:var(--ink-70); }
  .footer-links a{ cursor:pointer; }
  .footer-links a:hover{ color:var(--ink); }

  /* ===== Auth ===== */
  .auth-wrap{ max-width:420px; margin:0 auto; padding:64px 24px 60px; }
  .auth-wrap h1{ font-size:30px; margin:0 0 6px; }
  .auth-wrap p.lead{ color:var(--ink-70); margin:0 0 28px; font-size:14.5px; }
  .auth-card{ padding:26px; }
  .switch-row{ text-align:center; margin-top:18px; font-size:14px; color:var(--ink-70); }
  .switch-row a{ font-weight:700; color:var(--teal); cursor:pointer; }
  .check-row{ display:flex; gap:10px; align-items:flex-start; font-size:13px; color:var(--ink-70); margin:14px 0 18px; }
  .check-row input{ width:16px; height:16px; margin-top:2px; flex:none; }

  /* ===== Dashboard ===== */
  .page{ padding:28px 24px 40px; max-width:840px; margin:0 auto; }
  .page-wide{ max-width:1040px; }
  .page-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; flex-wrap:wrap; gap:10px; }
  .page-head h1{ font-size:24px; margin:0; }
  .greet{ font-size:26px; margin:0 0 4px; }
  .greet-sub{ color:var(--ink-70); font-size:14px; margin:0 0 22px; }

  .journey-active{ padding:22px; margin-bottom:20px; background: linear-gradient(135deg, var(--ink), #24365e); color:var(--paper); border:none; }
  :root[data-theme="dark"] .journey-active{ background: linear-gradient(135deg, #223151, #1a2540); }
  .journey-active .route-row{ font-family:'Fraunces',serif; font-size:23px; font-weight:600; display:flex; align-items:center; gap:10px; margin-bottom:6px;}
  .journey-active .je-meta{ opacity:.78; font-size:13.5px; }
  .journey-active .status{ display:inline-flex; align-items:center; gap:6px; margin-top:14px; font-size:12.5px; font-weight:600; background:rgba(255,255,255,.14); padding:5px 12px; border-radius:999px; }
  .status-dot{ width:6px; height:6px; border-radius:50%; background:#7CE0B0; }

  .stat-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:22px; }
  .stat-card{ padding:16px; text-align:left; }
  .stat-card .num{ font-family:'Fraunces',serif; font-size:26px; font-weight:600; }
  .stat-card .lbl{ font-size:12px; color:var(--ink-70); margin-top:2px; }

  .quick-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; }
  .quick-card{ padding:16px; display:flex; flex-direction:column; gap:10px; cursor:pointer; transition: box-shadow .15s; }
  .quick-card:hover{ box-shadow: 0 4px 18px -8px rgba(27,42,74,.3); }
  .quick-card svg{ width:20px; height:20px; color:var(--teal); }
  .quick-card .title{ font-weight:600; font-size:14.5px; }
  .quick-card .desc{ font-size:12px; color:var(--ink-70); }

  h2.section-title{ font-size:17px; margin:28px 0 12px; font-family:'Inter'; font-weight:700; }

  /* ===== Add Journey ===== */
  .seg{ display:flex; gap:8px; flex-wrap:wrap; }
  .seg-btn{ padding:10px 16px; border-radius:10px; border:1px solid var(--line-strong); background:var(--white); font-weight:600; font-size:13.5px; cursor:pointer; color:var(--ink-70); }
  .seg-btn.active{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
  .radio-row{ display:flex; gap:8px; flex-direction:column; }
  .radio-opt{ display:flex; align-items:center; gap:10px; padding:11px 13px; border:1px solid var(--line-strong); border-radius:10px; cursor:pointer; font-size:14px; }
  .radio-opt.checked{ border-color:var(--teal); background: rgba(47,111,99,.06); }
  .radio-opt input{ width:auto; margin:0; }

  /* ===== Discover ===== */
  .filter-row{ display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; margin-bottom:18px; -ms-overflow-style:none; scrollbar-width:none; }
  .filter-row::-webkit-scrollbar{ display:none; }
  .chip-filter{ flex:none; padding:9px 15px; border-radius:999px; border:1px solid var(--line-strong); font-size:13px; font-weight:600; background:var(--white); color:var(--ink-70); cursor:pointer; white-space:nowrap; }
  .chip-filter.active{ background:var(--teal); border-color:var(--teal); color:#fff; }

  .traveler-card{ padding:18px; margin-bottom:12px; }
  .tc-top{ display:flex; gap:12px; align-items:center; }
  .tc-name-row{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .tc-name{ font-weight:700; font-size:16px; font-family:'Fraunces',serif; }
  .tc-route{ font-size:13.5px; color:var(--ink-70); margin-top:2px; }
  .tc-interests{ display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
  .tag{ font-size:11.5px; padding:4px 10px; border-radius:999px; background:var(--paper-2); color:var(--ink-70); }
  .tc-actions{ display:flex; gap:8px; margin-top:14px; }

  /* ===== Chat ===== */
  .chat-list-item{ display:flex; gap:12px; padding:14px; align-items:center; cursor:pointer; border-bottom:1px solid var(--line); }
  .chat-list-item:hover{ background:var(--paper-2); }
  .chat-list-item .cname{ font-weight:700; font-size:14.5px; }
  .chat-list-item .clast{ font-size:12.5px; color:var(--ink-45); }
  .badge-dot{ width:9px; height:9px; border-radius:50%; background:var(--amber); flex:none; margin-left:auto; }

  .chat-window{ display:flex; flex-direction:column; height: calc(100vh - 64px - 68px); }
  @media(min-width:900px){ .chat-window{ height: calc(100vh - 64px); } }
  .chat-head{ display:flex; align-items:center; gap:12px; padding:14px 18px; border-bottom:1px solid var(--line); background:var(--white); }
  .chat-body{ flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:10px; }
  .bubble{ max-width:72%; padding:10px 14px; border-radius:16px; font-size:14.5px; line-height:1.4; }
  .bubble.me{ align-self:flex-end; background:var(--ink); color:var(--paper); border-bottom-right-radius:4px; }
  .bubble.them{ align-self:flex-start; background:var(--white); border:1px solid var(--line); border-bottom-left-radius:4px; }
  .bubble.system{ align-self:center; background:var(--paper-2); color:var(--ink-70); font-size:12.5px; border-radius:10px; }
  .chat-safety{ margin:8px 18px 0; padding:11px 14px; background:rgba(226,163,61,.12); border:1px solid rgba(226,163,61,.35); border-radius:10px; font-size:12.5px; color:var(--amber-dark); }
  .chat-input-row{ display:flex; gap:10px; padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px)); border-top:1px solid var(--line); background:var(--white); }
  .chat-input-row input{ flex:1; border-radius:999px; }
  .icebreaker-box{ margin:10px 18px 0; padding:12px 14px; border:1px dashed var(--teal); border-radius:12px; background: rgba(47,111,99,.06); font-size:13.5px; }
  .icebreaker-box .ib-label{ font-weight:700; color:var(--teal); font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; margin-bottom:4px; }

  /* ===== Profile ===== */
  .profile-head{ display:flex; gap:16px; align-items:center; margin-bottom:22px; }
  .profile-avatar{ width:74px; height:74px; border-radius:50%; font-size:26px; }
  .badge-row{ display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
  .settings-row{ display:flex; align-items:center; justify-content:space-between; padding:14px 0; border-bottom:1px solid var(--line); }
  .settings-row:last-child{ border-bottom:none; }
  .settings-row .st-title{ font-weight:600; font-size:14.5px; }
  .settings-row .st-desc{ font-size:12.5px; color:var(--ink-70); margin-top:2px; }
  .toggle{ position:relative; width:44px; height:26px; border-radius:999px; background:var(--line-strong); border:none; cursor:pointer; flex:none; }
  .toggle::after{ content:""; position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:#fff; transition:transform .15s; box-shadow:0 1px 3px rgba(0,0,0,.3); }
  .toggle.on{ background:var(--teal); }
  .toggle.on::after{ transform:translateX(18px); }

  /* ===== Safety ===== */
  .safety-tile{ padding:20px; margin-bottom:14px; display:flex; gap:14px; align-items:flex-start; cursor:pointer; }
  .safety-tile svg{ width:22px; height:22px; color:var(--rust); flex:none; margin-top:2px; }
  .safety-tile.emg{ background: linear-gradient(135deg, var(--rust), #8f2f1c); color:#fff; border:none; }
  .safety-tile.emg svg{ color:#fff; }
  .safety-tile.emg .st-desc{ color:rgba(255,255,255,.82); }
  .st-title{ font-weight:700; font-size:15.5px; }
  .st-desc{ font-size:13px; color:var(--ink-70); margin-top:3px; }

  /* ===== Notifications ===== */
  .notif-item{ display:flex; gap:12px; padding:16px 0; border-bottom:1px solid var(--line); }
  .notif-item.unread{ position:relative; }
  .notif-item.unread::before{ content:""; position:absolute; left:-14px; top:22px; width:7px; height:7px; border-radius:50%; background:var(--amber); }
  .notif-icon{ width:36px; height:36px; border-radius:10px; background:var(--paper-2); display:flex; align-items:center; justify-content:center; flex:none; }
  .notif-icon svg{ width:17px; height:17px; color:var(--teal); }
  .notif-text{ font-size:14px; }
  .notif-time{ font-size:12px; color:var(--ink-45); margin-top:2px; }

  /* ===== Modal ===== */
  .modal-backdrop{ position:fixed; inset:0; background:rgba(18,24,42,.5); z-index:100; display:flex; align-items:flex-end; justify-content:center; }
  @media(min-width:640px){ .modal-backdrop{ align-items:center; } }
  .modal{ background:var(--white); width:100%; max-width:460px; border-radius:20px 20px 0 0; padding:24px; max-height:85vh; overflow-y:auto; }
  @media(min-width:640px){ .modal{ border-radius:20px; } }
  .modal h3{ margin:0 0 4px; font-size:19px; }
  .modal .close-x{ float:right; background:none; border:none; font-size:20px; cursor:pointer; color:var(--ink-45); }

  .toast-wrap{ position:fixed; top:calc(16px + env(safe-area-inset-top,0px)); left:50%; transform:translateX(-50%); z-index:200; display:flex; flex-direction:column; gap:8px; align-items:center; }
  .toast{ background:var(--ink); color:var(--paper); padding:11px 18px; border-radius:999px; font-size:13.5px; font-weight:600; box-shadow:var(--shadow); animation: toastin .2s ease; }
  @keyframes toastin{ from{ opacity:0; transform:translateY(-8px);} to{opacity:1; transform:translateY(0);} }

function fmtTime(ts){ const d = new Date(ts); return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}); }
function timeAgo(ts){
  const s = Math.floor((Date.now()-ts)/1000);
  if (s<60) return 'just now';
  if (s<3600) return Math.floor(s/60)+'m ago';
  if (s<86400) return Math.floor(s/3600)+'h ago';
  return Math.floor(s/86400)+'d ago';
}

}

function getConvo(otherId){
  const c = convos();
  if (!c[otherId]) return null;
  return c[otherId];
}
function ensureConvo(otherId){
  const c = convos();
  if (!c[otherId]){
    const other = getUser(otherId);
    c[otherId] = { messages: [
      {from:otherId, text: demoOpeners(other), time: Date.now()-1000*60*60*2}
    ]};
    saveConvos(c);
  }
  return c[otherId];
}
function demoOpeners(u){
  const openers = [
    `Hey! Saw we're on the same journey — excited for the trip 🙂`,
    `Hi there! Looks like we're headed the same way.`,
    `Hello! Noticed we share the ${u.interests[0]} interest — small world.`,
  ];
  return openers[Math.floor(Math.random()*openers.length)];
}
function sendMessage(otherId, text){
  const c = convos();
  if (!c[otherId]) c[otherId] = {messages:[]};
  c[otherId].messages.push({from: state.currentUser.id, text, time: Date.now()});
  saveConvos(c);
}

/* ============ ICEBREAKER (local rule-based) ============ */
function generateIcebreaker(userA, userB){
  const shared = userA.interests.filter(i => userB.interests.includes(i));
  const templates = {
    'Photography': "You both enjoy photography. Ask: what's the most beautiful place you've photographed?",
    'Travel': "You both love travel. Ask about their favorite destination so far.",
    'Technology': "You're both into technology. Ask what they're building or working on right now.",
    'Students': "You're both students. Ask what they're studying.",
    'Music': "You both like music. Ask what's on their travel playlist.",
    'Food': "You both enjoy food. Ask for their top food recommendation for this trip.",
    'Startups': "You're both into startups. Ask what idea they'd build if time and money weren't a problem.",
  };
  if (shared.length){
    return shared.map(s => templates[s]).filter(Boolean);
  }
  return [`Ask ${userB.name.split(' ')[0]} what's taking them on this journey.`];
}

function requireAuth(){

  return true;
}

function render(){
  const root = document.getElementById('root');
  const route = (location.hash || '#/').split('?')[0];

  const publicRoutes = ['#/', '#/login', '#/signup', '#/privacy', '#/guidelines'];
  if (!state.currentUser && !publicRoutes.includes(route)){
    root.innerHTML = ''; navigate('#/login'); return;
  }
  if (state.currentUser && (route === '#/login' || route === '#/signup')){
    navigate('#/dashboard'); return;
  }

  let html = '';
  if (route === '#/') html = renderLanding();
  else if (route === '#/login') html = renderAuth('login');
  else if (route === '#/signup') html = renderAuth('signup');
  else if (route === '#/dashboard') html = shell(renderDashboard(), 'home');
  else if (route === '#/journey/add') html = shell(renderAddJourney(), 'journey');
  else if (route === '#/journey') html = shell(renderJourneyPage(), 'journey');
  else if (route === '#/discover') html = shell(renderDiscover(), 'discover');
  else if (route === '#/chat') html = shell(renderChatList(), 'chat');
  else if (route.startsWith('#/chat/')) html = shell(renderChatWindow(route.split('/')[2]), 'chat');
  else if (route === '#/profile') html = shell(renderProfile(), 'profile');
  else if (route === '#/safety') html = shell(renderSafety(), 'profile');
  else if (route === '#/emergency') html = shell(renderEmergency(), 'profile');
  else if (route === '#/verification') html = shell(renderVerification(), 'profile');
  else if (route === '#/notifications') html = shell(renderNotifications(), 'profile');
  else if (route === '#/privacy') html = renderStatic('privacy');
  else if (route === '#/guidelines') html = renderStatic('guidelines');
  else html = shell(renderDashboard(), 'home');

  root.innerHTML = html;
  window.scrollTo(0,0);
  attachHandlers(route);
}

function doLogin(email){
  const users = allUsers();
  let u = users.find(x => (x.email||'').toLowerCase() === email.toLowerCase());
  if (!u){
    // fallback: log into first demo account with a friendly note, or match by name-based demo emails
    const demoMap = {'priya@demo.app':'u_priya','rahul@demo.app':'u_rahul','ananya@demo.app':'u_ananya','karan@demo.app':'u_karan','sneha@demo.app':'u_sneha','arjun@demo.app':'u_arjun'};
    const id = demoMap[email.toLowerCase()];
    if (id) u = getUser(id);
  }
  if (!u){ toast("No account found with that email — try signing up, or use priya@demo.app"); return; }
  state.currentUser = u;
  LS.set('tc_current_user', u);
  navigate('#/dashboard');
  toast(`Welcome back, ${u.name.split(' ')[0]}!`);
}

function doSignup(data){
  const users = allUsers();
  const id = uid('u');
  const newUser = {
    id, name: data.name, email: data.email, age: Number(data.age), gender: data.gender,
    city: data.city, bio: 'New to TravelConnect — excited to meet fellow travelers.',
    interests: data.interests.split(',').map(s=>s.trim()).filter(Boolean),
    verified: {basic:true, journey:false, identity:false},
    visibility:'everyone', hideSeat:false, verifiedOnly:false,
  };
  users.push(newUser);
  saveUsers(users);
  state.currentUser = newUser;
  LS.set('tc_current_user', newUser);
  navigate('#/journey/add');
  toast('Account created — add your first journey!');
}

function doLogout(){
  state.currentUser = null;
  localStorage.removeItem('tc_current_user');
  navigate('#/');
  toast('Logged out');
}

/* ============ DISCOVER ============ */
let discoverFilter = 'same';
function renderDiscover(){
  const u = state.currentUser;
  const j = myJourney();
  const blocked = blockedIds();
  let candidates = allUsers().filter(x => x.id !== u.id && !blocked.includes(x.id));

  const filters = [
    {key:'same', label:'Same Journey'},
    {key:'coach', label:'Same Coach'},
    {key:'interests', label:'Similar Interests'},
    {key:'women', label:'Women Only'},
    {key:'students', label:'Students'},
    {key:'verified', label:'Verified Only'},
  ];

  const cards = candidates.map(person => {
    const pj = allJourneys().filter(x=>x.userId===person.id).slice(-1)[0];
    return {person, pj};
  }).filter(({person,pj})=>{
    if (discoverFilter==='same' && j && pj) return pj.from===j.from && pj.to===j.to && pj.date===j.date;
    if (discoverFilter==='coach' && j && pj) return pj.coach && j.coach && pj.coach===j.coach;
    if (discoverFilter==='interests') return person.interests.some(i=>u.interests.includes(i));
    if (discoverFilter==='women') return person.gender==='Female';
    if (discoverFilter==='students') return person.interests.includes('Students');
    if (discoverFilter==='verified') return person.verified.identity || person.verified.journey;
    return true;
  });

  const list = cards.length ? cards.map(({person,pj})=>travelerCard(person,pj)).join('') :
    `<div class="empty">${icon('compass')}<div>No travelers match this filter yet. Try another filter.</div></div>`;

  return `<div class="page">
    <div class="page-head"><h1>People On Your Journey</h1></div>
    <div class="filter-row">
      ${filters.map(f=>`<button class="chip-filter ${discoverFilter===f.key?'active':''}" data-f="${f.key}">${f.label}</button>`).join('')}
    </div>
    ${list}
  </div>`;
}
function travelerCard(person, pj){
  const shared = person.interests.filter(i=>state.currentUser.interests.includes(i));
  return `<div class="card traveler-card">
    <div class="tc-top">
      <div class="avatar" style="background:${avatarColor(person.id)};width:46px;height:46px;">${initials(person.name)}</div>
      <div style="flex:1;">
        <div class="tc-name-row">
          <span class="tc-name">${person.name.split(' ')[0]}, ${person.age}</span>
          ${(person.verified.identity||person.verified.journey) ? `<span class="pill pill-teal">${icon('badge')} Verified</span>` : ''}
        </div>
        ${pj ? `<div class="tc-route">${pj.from} → ${pj.to} · ${fmtDate(pj.date)} ${pj.coach?'· Coach '+pj.coach:''}</div>` : `<div class="tc-route">${person.city}</div>`}
      </div>

    <div class="tc-interests">${person.interests.map(i=>`<span class="tag ${shared.includes(i)?'':''}">${i}</span>`).join('')}</div>

      <button class="btn btn-outline btn-sm" onclick="navigate('#/chat/${person.id}')">View Chat</button>

function renderChatWindow(otherId){
  const other = getUser(otherId);
  if (!other) return `<div class="page">${icon('compass')}<p>Traveler not found.</p></div>`;
  const convo = ensureConvo(otherId);
  const u = state.currentUser;
  const isBlocked = blockedIds().includes(otherId);

  const bubbles = convo.messages.map(m => {
    const cls = m.from===u.id ? 'me' : 'them';
    return `<div class="bubble ${cls}">${escapeHtml(m.text)}</div>`;
  }).join('');

  return `<div class="chat-window">
    <div class="chat-head">
      <button class="btn-ghost btn" style="padding:6px;" onclick="navigate('#/chat')">${icon('chevron')}</button>
      <div class="avatar" style="background:${avatarColor(otherId)}">${initials(other.name)}</div>
      <div style="flex:1;">
        <div style="font-weight:700;font-size:14.5px;">${other.name}</div>
        <div style="font-size:12px;color:var(--ink-45);">${other.city} · online</div>
      </div>
      <button class="btn-ghost btn btn-sm" onclick="openReportModal('${otherId}')">${icon('flag')}</button>
      <button class="btn-ghost btn btn-sm" onclick="toggleBlock('${otherId}')">${isBlocked?'Unblock':icon('block')}</button>
    </div>
    <div class="chat-safety">${icon('shield')} Stay safe. Never share financial information, passwords, OTPs, or sensitive personal information with another traveler.</div>
    <div class="chat-body" id="chatBody">${bubbles}</div>
    <div class="icebreaker-box" id="ibBox" style="display:none;"></div>
    <div class="chat-input-row">
      <button class="btn btn-outline btn-sm" type="button" onclick="showIcebreaker('${otherId}')">${icon('sparkle')} Icebreaker</button>
      <input id="chatInput" placeholder="${isBlocked?'You have blocked this traveler':'Type a message…'}" ${isBlocked?'disabled':''} onkeydown="if(event.key==='Enter'){sendChatMsg('${otherId}')}">
      <button class="btn btn-primary" type="button" ${isBlocked?'disabled':''} onclick="sendChatMsg('${otherId}')">Send</button>
    </div>
  </div>`;
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function sendChatMsg(otherId){
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;
  sendMessage(otherId, text);
  input.value='';
  render();
  setTimeout(()=>{ const body=document.getElementById('chatBody'); if(body) body.scrollTop = body.scrollHeight; }, 0);
  // simple demo auto-reply
  setTimeout(()=>{
    const c = convos();
    const other = getUser(otherId);
    const replies = ["That sounds great!", "Haha, same here.", "Nice — looking forward to the trip.", "Good to know, thanks for sharing!"];
    c[otherId].messages.push({from:otherId, text: replies[Math.floor(Math.random()*replies.length)], time: Date.now()});
    saveConvos(c);
    if (location.hash === '#/chat/'+otherId) render();
  }, 1200);
}
function showIcebreaker(otherId){
  const other = getUser(otherId);
  const lines = generateIcebreaker(state.currentUser, other);
  const box = document.getElementById('ibBox');
  box.style.display = 'block';
  box.innerHTML = `<div class="ib-label">${icon('sparkle')} AI Icebreaker</div>` + lines.map(l=>`<div style="margin-top:4px;">${l}</div>`).join('');
}

    <div class="page-head"><h1>Trust & Verification</h1></div>
    <div class="pill pill-amber" style="margin-bottom:18px;">Demo Verification — this prototype does not verify real government ID or PNR data</div>
    ${verifyTile('Basic Profile','Email verified', u.verified.basic)}
    ${verifyTile('Journey Verified','Travel details confirmed by the user', u.verified.journey, 'journey')}
    ${verifyTile('Identity Verified','Demo-only verification status', u.verified.identity, 'identity')}
  </div>`;
}
function verifyTile(title, desc, active, key){
  return `<div class="card" style="padding:18px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;">
    <div><div class="st-title">${title}</div><div class="st-desc">${desc}</div></div>
    ${active ? `<span class="pill pill-teal">${icon('badge')} Verified</span>` : key ? `<button class="btn btn-outline btn-sm" onclick="demoVerify('${key}')">Verify (Demo)</button>` : `<span class="pill pill-line">Pending</span>`}
  </div>`;
}
function demoVerify(key){
  const users = allUsers();
  const idx = users.findIndex(x=>x.id===state.currentUser.id);
  users[idx].verified[key] = true;
  saveUsers(users);
  state.currentUser = users[idx];
  LS.set('tc_current_user', state.currentUser);
  toast('Demo verification complete.');
  render();
}

/* ============ SAFETY CENTER ============ */
function renderSafety(){
  return `<div class="page">
    <div class="page-head"><h1>Safety Center</h1></div>
    <div class="card safety-tile emg" onclick="navigate('#/emergency')">
      ${icon('sos')}
      <div><div class="st-title">Emergency Help</div><div class="st-desc">One-tap access to emergency numbers and sharing your journey</div></div>
    </div>
    <div class="card safety-tile" onclick="openReportModal()">
      ${icon('flag')}
      <div><div class="st-title">Report Someone</div><div class="st-desc">Flag harassment, spam, scams or inappropriate behavior</div></div>
    </div>
    <div class="card safety-tile" onclick="navigate('#/chat')">
      ${icon('block')}
      <div><div class="st-title">Block a user</div><div class="st-desc">Open a chat to block — they'll be hidden from discovery instantly</div></div>
    </div>
    <h2 class="section-title">Blocked travelers</h2>
    <div class="card" style="padding:6px 18px;">
      ${renderBlockedList()}
    </div>
  </div>`;
}
function renderBlockedList(){
  const ids = blockedIds();
  if (!ids.length) return `<div style="padding:16px 0;color:var(--ink-45);font-size:13.5px;">No blocked travelers.</div>`;
  return ids.map(id=>{
    const p = getUser(id); if(!p) return '';
    return `<div class="settings-row"><div class="st-title">${p.name}</div><button class="btn btn-outline btn-sm" onclick="toggleBlock('${id}')">Unblock</button></div>`;
  }).join('');
}
function toggleBlock(id){
  let list = blockedIds();
  if (list.includes(id)){ list = list.filter(x=>x!==id); toast('Unblocked.'); }
  else { list.push(id); toast('User blocked. They are hidden from discovery and chat.'); }
  saveBlocked(list);
  render();
}

function renderEmergency(){
  return `<div class="page">
    <div class="page-head"><h1>Emergency Help</h1></div>
    <div class="card" style="padding:22px;background:linear-gradient(135deg,var(--rust),#8f2f1c);color:#fff;border:none;margin-bottom:18px;">
      <div style="font-family:'Fraunces',serif;font-size:20px;font-weight:600;margin-bottom:4px;">India Emergency Number</div>
      <div style="font-size:38px;font-weight:700;">112</div>
    </div>
    <button class="btn btn-danger btn-block" style="margin-bottom:12px;" onclick="toast('This would dial 112 where your device supports it. Not wired to a real call in this prototype.')">${icon('sos')} Call Emergency Services</button>
    <button class="btn btn-outline btn-block" style="margin-bottom:12px;" onclick="toast('Journey shared (simulated) — real sharing needs backend + device permissions.')">Share My Journey</button>
    <button class="btn btn-outline btn-block" style="margin-bottom:12px;" onclick="toast('Location sharing simulated — real sharing needs device location permission.')">Share Location</button>
    <button class="btn btn-outline btn-block" onclick="toast('Trusted contact notified (simulated).')">Contact Trusted Person</button>
    <p class="hint" style="margin-top:16px;">This is a free prototype. Location sharing and emergency dialing are simulated and clearly marked — real integration requires backend services and device permissions.</p>
  </div>`;
}

/* Report modal */
function openReportModal(userId){
  const others = allUsers().filter(u=>u.id!==state.currentUser.id);
  const target = userId || (others[0] && others[0].id);
  const reasons = ['Harassment','Spam','Scam','Threatening behavior','Inappropriate content','Fake profile','Other'];
  const modal = document.createElement('div');
  modal.className = 'modal-backdrop';
  modal.innerHTML = `<div class="modal">
    <button class="close-x" onclick="this.closest('.modal-backdrop').remove()">✕</button>
    <h3>Report someone</h3>
    <p style="color:var(--ink-70);font-size:13.5px;margin:0 0 16px;">Reports are reviewed against our Community Guidelines.</p>
    <form id="reportForm">
      <div class="field"><label>Who are you reporting?</label>
        <select name="target">${others.map(o=>`<option value="${o.id}" ${o.id===target?'selected':''}>${o.name}</option>`).join('')}</select>
      </div>
      <div class="field"><label>Reason</label>
        <select name="reason">${reasons.map(r=>`<option>${r}</option>`).join('')}</select>
      </div>
      <div class="field"><label>Additional details (optional)</label><textarea name="note" rows="3" placeholder="Tell us what happened"></textarea></div>
      <button class="btn btn-danger btn-block" type="submit">Submit report</button>
    </form>
  </div>`;
  document.body.appendChild(modal);
  modal.querySelector('#reportForm').addEventListener('submit', e=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const list = reports();
    list.push({id:uid('r'), reportedUserId: fd.get('target'), reason: fd.get('reason'), note: fd.get('note'), reporterId: state.currentUser.id, time: Date.now(), status:'open'});
    saveReports(list);
    modal.remove();
    toast('Report submitted. Our team will review it.');
  });
}

/* ============ NOTIFICATIONS ============ */
function renderNotifications(){
  const n = notifications();
  const iconFor = {message:'chat', people:'people', interest:'sparkle', journey:'route'};
  const list = n.map(x=>`<div class="notif-item ${x.read?'':'unread'}">
    <div class="notif-icon">${icon(iconFor[x.type]||'bell')}</div>
    <div><div class="notif-text">${x.text}</div><div class="notif-time">${timeAgo(x.time)}</div></div>
  </div>`).join('');
  // mark as read
  const updated = n.map(x=>({...x, read:true})); saveNotifs(updated);
  return `<div class="page">
    <div class="page-head"><h1>Notifications</h1></div>
    <div class="card" style="padding:0 18px;">${list || '<div class="empty">'+icon('bell')+'<div>No notifications yet.</div></div>'}</div>
  </div>`;
}

  const back = state.currentUser ? '#/profile' : '#/';
  if (which === 'privacy'){
    return `<div id="topbar"><div class="topbar-inner"><div class="brand"><div class="brand-mark">${icon('route')}</div>TravelConnect</div><a class="btn btn-ghost btn-sm" onclick="navigate('${back}')">Back</a></div></div>
    <div class="center-page prose">
      <h1>Privacy</h1>
      <ul>
        <li>Phone numbers are not publicly displayed.</li>

        <li>Exact seat information can be hidden.</li>

  <div class="center-page prose">
    <h1>Community Guidelines</h1>

      <li>Respect other travelers.</li>
      <li>No harassment.</li>
      <li>No scams.</li>

      <li>No financial requests.</li>
      <li>Do not share another person's private information.</li>
      <li>Report suspicious behavior.</li>
      <li>Respect personal boundaries.</li>
    </ol>
  </div>`;
}

/* ============ EVENT WIRING ============ */
function attachHandlers(route){
  const loginForm = document.getElementById('loginForm');
  if (loginForm) loginForm.addEventListener('submit', e=>{ e.preventDefault(); doLogin(new FormData(e.target).get('email')); });

  const signupForm = document.getElementById('signupForm');
  if (signupForm) signupForm.addEventListener('submit', e=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    doSignup({name:fd.get('name'), email:fd.get('email'), age:fd.get('age'), gender:fd.get('gender'), city:fd.get('city'), interests:fd.get('interests')||''});
  });

  const transportSeg = document.getElementById('transportSeg');
  if (transportSeg) transportSeg.querySelectorAll('.seg-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      transportSeg.querySelectorAll('.seg-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active'); addJourneyTransport = btn.dataset.t;
    });
  });
  const seatRow = document.getElementById('seatPrivacyRow');
  if (seatRow) seatRow.querySelectorAll('.radio-opt').forEach(opt=>{
    opt.addEventListener('click', ()=>{
      seatRow.querySelectorAll('.radio-opt').forEach(o=>o.classList.remove('checked'));
      opt.classList.add('checked');
    });
  });
  const journeyForm = document.getElementById('journeyForm');
  if (journeyForm) journeyForm.addEventListener('submit', e=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const js = allJourneys();
    js.push({
      id: uid('j'), userId: state.currentUser.id, transport: addJourneyTransport,
      from: fd.get('from'), to: fd.get('to'), date: fd.get('date'), time: fd.get('time'),
      number: fd.get('number'), coach: fd.get('coach'), seat: fd.get('seat'),
      seatPrivacy: fd.get('seatPrivacy') || 'nearby',
    });
    saveJourneys(js);
    pushNotif(`Your journey ${fd.get('from')} → ${fd.get('to')} was added.`, 'journey');
    toast('Journey saved!');
    navigate('#/dashboard');
  });

  document.querySelectorAll('.chip-filter').forEach(btn=>{
    btn.addEventListener('click', ()=>{ discoverFilter = btn.dataset.f; render(); });
  });

  document.querySelectorAll('input[name="visibility"]').forEach(r=>{
    r.addEventListener('change', ()=>{
      const users = allUsers(); const idx = users.findIndex(x=>x.id===state.currentUser.id);
      users[idx].visibility = r.value; saveUsers(users);
      state.currentUser = users[idx]; LS.set('tc_current_user', state.currentUser);
      toast('Visibility updated.');
    });
  });

  if (route.startsWith('#/chat/')){
    const body = document.getElementById('chatBody');
    if (body) body.scrollTop = body.scrollHeight;
  }
}

render();
</script>
